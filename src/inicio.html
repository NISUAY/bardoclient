<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BARRA LATERAL IZQUIERDA - VERSIÓN MODULAR OPTIMIZADA (Paso 1) -->
    <div class="sidebar">
        
        <!-- SECCIÓN SUPERIOR: DATOS DE LA CUENTA -->
        <div class="sidebar-account-section">
            <!-- Icono cuadrado con la cara de la skin en el futuro -->
            <div class="account-avatar-wrapper">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
            </div>
            <!-- Bloque de textos ocultos al costado -->
            <div class="sidebar-text-fade account-info-block">
                <span class="account-player-name">Cargando...</span>
                <span class="account-logout-btn">Cerrar sesión</span>
            </div>
        </div>

        <div class="sidebar-divider-line"></div>

        <!-- SECCIÓN CENTRAL: los servidores se inyectan desde renderer.js -->
        <div class="sidebar-scrollable-servers" id="contenedor-servidores"></div>

        <!-- SECCIÓN INFERIOR: CONFIGURACIÓN FIJA -->
        <div class="sidebar-fixed-bottom">
            <div class="sidebar-divider-line"></div>
            <div class="sidebar-menu-row" id="btn-settings">
                <div class="server-icon settings-icon">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -2.37 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
                </div>
                <span class="sidebar-text-fade item-label-text">Configuraciones</span>
            </div>
        </div>

    </div>

    <!-- CONTENIDO PRINCIPAL (SÓLO INICIO) -->
    <div class="main-content">
        <div class="selected-server-info" aria-live="polite">
            <span id="txt-server-name"></span>
            <span id="txt-server-version"></span>
        </div>
        <button class="play-button" id="btn-play">
            <svg xmlns="http://w3.org" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-player-play"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>
            JUGAR
        </button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
